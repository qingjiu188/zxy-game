<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>郑晓银的模拟人生</title>
<style>
/* =========================================================
   0. 变量 / 基础
   ========================================================= */
:root{
  --bg-0:#04050c;
  --bg-1:#080a1a;
  --bg-2:#12082a;
  --cyan:34,224,255;
  --magenta:255,47,208;
  --purple:139,92,246;
  --mint:120,255,214;
  /* ---- 文章页主题色（默认 = 科幻）---- */
  --t1:34,224,255;   /* 主色 */
  --t2:255,47,208;   /* 副色 */
  --t3:139,92,246;   /* 辅色 */
  --t4:120,255,214;  /* 点缀 */
  --glass-bg:linear-gradient(160deg, rgba(20,32,66,.55), rgba(46,14,70,.34));
  --glass-border:rgba(140,220,255,.22);
  --radius:24px;
  --font:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:var(--font);
  color:#e8f4ff;
  background:var(--bg-0);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* ---- 四大主题：切换 body class 即可整体换肤 ---- */
body.theme-sci-fi     {--t1:34,224,255; --t2:255,47,208; --t3:139,92,246; --t4:120,255,214;}
body.theme-mystery    {--t1:255,64,96;  --t2:150,60,255; --t3:255,120,60;  --t4:255,190,190;}
body.theme-warm       {--t1:255,200,120;--t2:255,150,195;--t3:180,120,255; --t4:255,235,180;}
body.theme-adventure  {--t1:255,190,60; --t2:70,235,150; --t3:34,224,255;  --t4:255,240,140;}

/* 深空背景：多层星云 + 网格 */
.nebula{
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(60% 50% at 18% 12%, rgba(var(--t1),.16), transparent 60%),
    radial-gradient(55% 45% at 85% 20%, rgba(var(--t2),.14), transparent 62%),
    radial-gradient(70% 60% at 50% 108%, rgba(var(--t3),.20), transparent 65%),
    radial-gradient(40% 40% at 78% 82%, rgba(var(--t4),.10), transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 45%, var(--bg-2) 100%);
  transition:background 1.2s ease;
}
.nebula::after{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(120,200,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,200,255,.045) 1px, transparent 1px);
  background-size:64px 64px, 64px 64px;
  mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  animation:gridDrift 24s linear infinite;
}
@keyframes gridDrift{from{background-position:0 0,0 0;}to{background-position:0 64px,64px 0;}}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
}

/* ---- 主题专属背景动效层（科幻/悬疑/温情/冒险 各不相同）---- */
#theme-fx{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1s ease;}
#theme-fx.show{opacity:.32;}
body.theme-warm #theme-fx.show{opacity:.22;}
#theme-fx::before,#theme-fx::after{content:"";position:absolute;inset:-25%;}

/* 科幻：旋转星云光带 + 星点漂移 */
body.theme-sci-fi #theme-fx::before{
  background:conic-gradient(from 0deg at 50% 50%, transparent 0 58%, rgba(var(--t1),.10) 74%, transparent 88%);
  animation:spinSlow 42s linear infinite;
}
body.theme-sci-fi #theme-fx::after{
  background-image:radial-gradient(circle, rgba(255,255,255,.55) 1px, transparent 1.6px);
  background-size:130px 130px;opacity:.35;
  animation:starDrift 70s linear infinite;
}
/* 悬疑：故障条纹 + 暗红光闪烁 */
body.theme-mystery #theme-fx::before{
  background:repeating-linear-gradient(0deg, rgba(var(--t1),.11) 0 2px, transparent 2px 8px);
  mix-blend-mode:screen;
  animation:glitchShift 3.6s steps(7) infinite;
}
body.theme-mystery #theme-fx::after{
  background:radial-gradient(60% 50% at 50% 45%, rgba(var(--t2),.20), transparent 72%);
  animation:flicker 2.6s steps(4) infinite;
}
/* 温情：柔和光晕呼吸 + 飘落光点 */
body.theme-warm #theme-fx::before{
  background:
    radial-gradient(45% 40% at 28% 28%, rgba(var(--t1),.10), transparent 70%),
    radial-gradient(42% 36% at 76% 68%, rgba(var(--t2),.08), transparent 70%);
  animation:breatheGlow 7.5s ease-in-out infinite;
}
body.theme-warm #theme-fx::after{
  background-image:radial-gradient(circle, rgba(var(--t4),.95) 1.6px, transparent 2.2px);
  background-size:96px 96px;opacity:.5;
  animation:fallDown 15s linear infinite;
}
/* 冒险：斜向能量光带流动 */
body.theme-adventure #theme-fx::before{
  background:repeating-linear-gradient(115deg, transparent 0 42px, rgba(var(--t1),.15) 42px 48px, transparent 48px 118px);
  animation:bandMove 2.8s linear infinite;
}
body.theme-adventure #theme-fx::after{
  background:repeating-linear-gradient(65deg, transparent 0 62px, rgba(var(--t2),.11) 62px 70px, transparent 70px 168px);
  animation:bandMove 4.2s linear infinite reverse;
}
@keyframes spinSlow{to{transform:rotate(360deg);}}
@keyframes starDrift{to{background-position:130px 130px;}}
@keyframes glitchShift{
  0%{transform:translateY(0) skewX(0);}20%{transform:translateY(-6px) skewX(1deg);}
  40%{transform:translateY(4px) skewX(-1deg);}60%{transform:translateY(-2px);}80%{transform:translateY(7px);}100%{transform:translateY(0);}
}
@keyframes flicker{0%,100%{opacity:.55;}30%{opacity:.15;}55%{opacity:.85;}75%{opacity:.25;}}
@keyframes breatheGlow{0%,100%{opacity:.45;transform:scale(1);}50%{opacity:.72;transform:scale(1.05);}}
@keyframes fallDown{from{background-position:0 0;}to{background-position:60px 900px;}}
@keyframes bandMove{from{background-position:0 0;}to{background-position:240px 0;}}

/* =========================================================
   1. 全局特效层
   ========================================================= */
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:block;}
.fx-layer{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden;}
#flash{
  opacity:0;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(255,255,255,.25) 38%, rgba(255,255,255,0) 72%);
  mix-blend-mode:screen;
}
.pulse-ring{
  position:fixed;width:60vmax;height:60vmax;margin:-30vmax 0 0 -30vmax;
  border-radius:50%;
  border:1px solid rgba(var(--rc),.7);
  background:radial-gradient(circle, rgba(var(--rc),.32), rgba(var(--rc),.06) 45%, rgba(var(--rc),0) 62%);
  box-shadow:0 0 60px rgba(var(--rc),.45), inset 0 0 80px rgba(var(--rc),.25);
  mix-blend-mode:screen;
  opacity:0;
}
.warp-ring{
  position:fixed;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;
  border-radius:50%;
  border:2px solid rgba(34,224,255,.55);
  box-shadow:0 0 40px rgba(34,224,255,.45), inset 0 0 40px rgba(255,47,208,.25);
  mix-blend-mode:screen;opacity:0;
}
.shard{
  position:fixed;border-radius:8px;
  border:1px solid rgba(160,230,255,.35);
  box-shadow:0 0 18px rgba(34,224,255,.35), inset 0 1px 0 rgba(255,255,255,.35);
  will-change:transform,opacity;
}

/* =========================================================
   2. 视图容器
   ========================================================= */
.view{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:clamp(20px,4vh,48px) clamp(16px,4vw,56px);
}
.view.on{opacity:1;visibility:visible;}
.view::-webkit-scrollbar{width:6px;}
.view::-webkit-scrollbar-thumb{background:rgba(var(--cyan),.35);border-radius:3px;}

/* =========================================================
   3. 登录页
   ========================================================= */
#view-login{align-items:center;justify-content:center;}
.login-wrap{width:min(430px,100%);position:relative;}
.login-card{
  position:relative;
  padding:38px 34px 32px;
  border-radius:var(--radius);
  background-image:linear-gradient(160deg, rgba(18,30,64,.72), rgba(46,14,72,.5));
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--glass-border);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 1px 0 rgba(255,255,255,.28) inset,
    0 -40px 80px rgba(139,92,246,.14) inset,
    0 24px 70px rgba(0,0,0,.55),
    0 0 60px rgba(34,224,255,.18);
  overflow:hidden;
}
/* 全息扫描线 */
.login-card::before{
  content:"";position:absolute;left:0;right:0;height:34%;
  top:-40%;
  background:linear-gradient(180deg, transparent, rgba(34,224,255,.10) 45%, rgba(255,47,208,.12) 60%, transparent);
  animation:holoScan 5.5s cubic-bezier(.5,0,.5,1) infinite;
  pointer-events:none;
}
@keyframes holoScan{0%{top:-40%;}55%{top:110%;}100%{top:110%;}}
/* 顶部霓虹细线 */
.login-card::after{
  content:"";position:absolute;left:8%;right:8%;top:0;height:1px;
  background:linear-gradient(90deg, transparent, rgba(var(--cyan),.9), rgba(var(--magenta),.9), transparent);
  box-shadow:0 0 12px rgba(var(--cyan),.8);
}
.corner{position:absolute;width:22px;height:22px;border:2px solid rgba(var(--cyan),.75);pointer-events:none;filter:drop-shadow(0 0 6px rgba(var(--cyan),.7));}
.corner.tl{left:12px;top:12px;border-right:0;border-bottom:0;border-radius:8px 0 0 0;}
.corner.tr{right:12px;top:12px;border-left:0;border-bottom:0;border-radius:0 8px 0 0;}
.corner.bl{left:12px;bottom:12px;border-right:0;border-top:0;border-radius:0 0 0 8px;}
.corner.br{right:12px;bottom:12px;border-left:0;border-top:0;border-radius:0 0 8px 0;}

.login-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(var(--cyan),.95);
  padding:5px 12px;border-radius:999px;
  border:1px solid rgba(var(--cyan),.35);
  background:rgba(var(--cyan),.08);
  box-shadow:0 0 18px rgba(var(--cyan),.22) inset;
  margin-bottom:16px;
}
.dot{width:6px;height:6px;border-radius:50%;background:rgb(var(--cyan));box-shadow:0 0 10px rgb(var(--cyan));animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.login-title{
  margin:0 0 6px;font-size:clamp(24px,5.4vw,32px);font-weight:800;letter-spacing:.04em;
  background:linear-gradient(92deg,#9df3ff,#ffffff 38%,#ff9ae8 78%,#c4b5fd);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(var(--cyan),.55));
}
.login-sub{margin:0 0 26px;font-size:12.5px;color:rgba(200,225,255,.55);letter-spacing:.08em;}

.field{position:relative;margin-bottom:16px;}
.field label{
  display:block;font-size:11px;letter-spacing:.2em;color:rgba(var(--cyan),.8);
  margin-bottom:7px;text-transform:uppercase;
}
.field input{
  width:100%;height:50px;padding:0 16px 0 44px;
  font-size:15px;color:#eaf7ff;font-family:var(--font);letter-spacing:.06em;
  background:rgba(8,14,32,.55);
  border:1px solid rgba(140,200,255,.18);
  border-radius:14px;
  outline:none;
  transition:border-color .25s, box-shadow .25s, background .25s;
}
.field input::placeholder{color:rgba(190,215,240,.3);letter-spacing:.05em;}
.field input:focus{
  border-color:rgba(var(--cyan),.85);
  background:rgba(10,22,48,.72);
  box-shadow:0 0 0 3px rgba(var(--cyan),.12), 0 0 26px rgba(var(--cyan),.4), inset 0 0 22px rgba(var(--cyan),.10);
}
.field .ico{
  position:absolute;left:15px;top:38px;font-size:16px;opacity:.75;pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(var(--cyan),.6));
}
.field.err input{border-color:rgba(255,70,90,.85);box-shadow:0 0 0 3px rgba(255,70,90,.12),0 0 24px rgba(255,70,90,.4);}

.login-btn{
  position:relative;width:100%;height:52px;margin-top:8px;
  border:1px solid rgba(var(--cyan),.55);border-radius:14px;
  background:linear-gradient(100deg, rgba(34,224,255,.20), rgba(139,92,246,.28) 55%, rgba(255,47,208,.20));
  color:#eafcff;font-size:16px;font-weight:700;letter-spacing:.28em;font-family:var(--font);
  cursor:pointer;overflow:hidden;
  box-shadow:0 0 24px rgba(var(--cyan),.25), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .18s, box-shadow .3s, letter-spacing .3s;
}
.login-btn:hover{
  box-shadow:0 0 40px rgba(var(--cyan),.5), 0 0 70px rgba(var(--magenta),.25), inset 0 1px 0 rgba(255,255,255,.4);
  transform:translateY(-1px);letter-spacing:.34em;
}
.login-btn:active{transform:scale(.985);}
.login-btn::after{
  content:"";position:absolute;top:0;bottom:0;width:38%;
  left:-45%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
  transform:skewX(-18deg);
}
.login-btn:hover::after{animation:btnScan .85s ease-in-out;}
@keyframes btnScan{from{left:-45%;}to{left:120%;}}
.login-btn.busy{pointer-events:none;opacity:.75;letter-spacing:.16em;}

.login-msg{
  min-height:20px;margin:14px 0 0;text-align:center;
  font-size:12.5px;letter-spacing:.06em;color:rgba(255,90,110,.95);
  text-shadow:0 0 14px rgba(255,60,80,.8);
  opacity:0;transform:translateY(-4px);transition:opacity .25s, transform .25s;
}
.login-msg.show{opacity:1;transform:none;}
.login-tip{
  margin-top:18px;text-align:center;font-size:11px;color:rgba(190,215,240,.35);letter-spacing:.14em;
}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  12%{transform:translateX(-12px) rotate(-.6deg);}
  28%{transform:translateX(11px) rotate(.5deg);}
  45%{transform:translateX(-8px) rotate(-.35deg);}
  62%{transform:translateX(6px);}
  80%{transform:translateX(-3px);}
}
.shake{animation:shake .6s cubic-bezier(.36,.07,.19,.97);}

/* =========================================================
   4. 主页
   ========================================================= */
#view-home{align-items:center;justify-content:center;text-align:center;}
.home-title{
  margin:0;font-size:clamp(34px,8.4vw,86px);font-weight:900;line-height:1.08;letter-spacing:.03em;
  background:linear-gradient(96deg,#7ef0ff 0%,#ffffff 26%,#ff8fe0 52%,#b9a6ff 76%,#7ef0ff 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(var(--cyan),.6)) drop-shadow(0 0 60px rgba(var(--magenta),.35));
  animation:neonBreath 4.2s ease-in-out infinite, hueSlide 12s linear infinite;
  min-height:1.2em;
}
@keyframes neonBreath{0%,100%{filter:drop-shadow(0 0 18px rgba(34,224,255,.45)) drop-shadow(0 0 48px rgba(255,47,208,.22));}
  50%{filter:drop-shadow(0 0 34px rgba(34,224,255,.85)) drop-shadow(0 0 80px rgba(255,47,208,.45));}}
@keyframes hueSlide{from{background-position:0% 50%;}to{background-position:220% 50%;}}
.caret{display:inline-block;width:.06em;height:.85em;vertical-align:-.08em;background:rgb(var(--cyan));box-shadow:0 0 14px rgb(var(--cyan));animation:blink .9s steps(1) infinite;color:transparent;}
.home-sub{
  margin:20px auto 0;max-width:640px;
  font-size:clamp(12px,2.6vw,15px);letter-spacing:.28em;color:rgba(200,225,255,.55);
}
.home-orbit{
  position:relative;width:min(360px,72vw);aspect-ratio:1;margin:6px auto 34px;
  display:grid;place-items:center;
}
.home-orbit i{
  position:absolute;inset:0;border-radius:50%;border:1px solid rgba(var(--cyan),.18);
  box-shadow:0 0 30px rgba(var(--cyan),.12) inset;
}
.home-orbit i:nth-child(1){animation:spin 14s linear infinite;}
.home-orbit i:nth-child(2){inset:12%;border-color:rgba(var(--magenta),.22);animation:spin 9s linear reverse infinite;}
.home-orbit i:nth-child(3){inset:24%;border-color:rgba(var(--purple),.28);border-style:dashed;animation:spin 20s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.home-orbit .core{
  position:absolute;width:38%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(34,224,255,.5) 35%, rgba(139,92,246,.25) 60%, transparent 72%);
  box-shadow:0 0 60px rgba(var(--cyan),.55);
  animation:corePulse 3.4s ease-in-out infinite;
}
@keyframes corePulse{0%,100%{transform:scale(.92);opacity:.85;}50%{transform:scale(1.06);opacity:1;}}

.start-btn{
  position:relative;
  padding:20px clamp(30px,6vw,64px);
  font-size:clamp(16px,3.4vw,21px);font-weight:800;letter-spacing:.34em;font-family:var(--font);
  color:#f2fdff;cursor:pointer;
  border-radius:20px;
  border:1px solid rgba(var(--cyan),.6);
  background:linear-gradient(140deg, rgba(14,26,56,.6), rgba(52,16,84,.5));
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.3),
    inset 0 -20px 40px rgba(139,92,246,.25),
    0 0 30px rgba(var(--cyan),.35),
    0 0 70px rgba(var(--magenta),.18);
  overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .3s, letter-spacing .3s;
}
.start-btn:hover{
  transform:translateY(-3px) scale(1.03);
  letter-spacing:.42em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45), 0 0 46px rgba(var(--cyan),.7), 0 0 110px rgba(var(--magenta),.35);
}
.start-btn:active{transform:scale(.98);}
.start-btn::before{
  content:"";position:absolute;inset:-40% -10%;
  background:conic-gradient(from 0deg, transparent 0 70%, rgba(34,224,255,.35) 82%, rgba(255,47,208,.35) 92%, transparent 100%);
  animation:spin 3.6s linear infinite;opacity:.7;mix-blend-mode:screen;
}
.start-btn span{position:relative;z-index:2;display:inline-block;text-shadow:0 0 18px rgba(var(--cyan),.8);}
.start-btn.busy{pointer-events:none;}

/* =========================================================
   5. 内页
   ========================================================= */
#view-inner{align-items:stretch;}
.inner-head{text-align:center;margin-bottom:clamp(14px,3vh,28px);flex:none;}
.inner-title{
  margin:0;font-size:clamp(24px,5.2vw,46px);font-weight:900;letter-spacing:.05em;
  background:linear-gradient(94deg,#8ef3ff,#ffffff 40%,#ffa6ec 72%,#c1b0ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(var(--cyan),.55));
  animation:neonBreath 4.6s ease-in-out infinite;
}
.inner-sub{margin:10px 0 0;font-size:12px;letter-spacing:.26em;color:rgba(200,225,255,.5);}
.grid{
  flex:1;
  display:grid;
  /* 卡片数量由 stories 数组决定：有文章才会生成卡片 */
  grid-template-columns:repeat(auto-fill,minmax(260px,330px));
  grid-auto-rows:minmax(88px,1fr);
  justify-content:center;
  align-content:start;
  gap:clamp(10px,1.6vw,18px);
  min-height:0;
}
.life-card{
  position:relative;overflow:hidden;cursor:pointer;
  border-radius:22px;
  padding:clamp(12px,1.6vw,20px);
  display:flex;align-items:center;gap:clamp(10px,1.4vw,16px);
  border:1px solid rgba(var(--c),.28);
  background:
    linear-gradient(150deg, rgba(255,255,255,.07), rgba(255,255,255,.015) 45%),
    linear-gradient(160deg, rgba(12,20,44,.55), rgba(38,12,62,.42));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.22),
    inset 0 -24px 40px rgba(var(--c),.10),
    0 10px 30px rgba(0,0,0,.4);
  transform-style:preserve-3d;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s, border-color .3s;
  will-change:transform;
  animation:cardFloat 6s ease-in-out infinite;
}
.life-card:nth-child(3n+2){animation-delay:-2s;}
.life-card:nth-child(3n+3){animation-delay:-4s;}
@keyframes cardFloat{0%,100%{translate:0 -3px;}50%{translate:0 3px;}}
.life-card::before{ /* 扫描线 */
  content:"";position:absolute;left:0;right:0;top:-60%;height:55%;
  background:linear-gradient(180deg, transparent, rgba(var(--c),.20), transparent);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.life-card:hover::before{opacity:1;animation:cardScan 1.3s linear infinite;}
@keyframes cardScan{from{top:-60%;}to{top:110%;}}

}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;}
}

<script>
/* =========================================================================
 * 郑晓银的模拟人生 —— 单文件 SPA
 * 模块：FX(Canvas 粒子系统) / Router(视图切换) / 各页面特效
 * ========================================================================= */
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

/* =========================================================================
 * 一、Canvas 2D 发光粒子系统
 * ========================================================================= */
const FX = (function () {
  const cvs = $('#fx');
  const ctx = cvs.getContext('2d', { alpha: true });

  // 设备判定：移动端 / 小屏减少粒子
  const isTouch = matchMedia('(hover: none)').matches || 'ontouchstart' in window;
  const isSmall = window.innerWidth < 820;
  const MOBILE = isTouch || isSmall;
  const MAX_P = MOBILE ? 48 : 130;          // 粒子上限
  const DPR = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.6 : 2);

  /* 调色板：0-4 基础色，5-9 为各文章主题专属色 */
  const PALETTE = [
    [34, 224, 255],   // 0 青蓝
    [255, 47, 208],   // 1 品红
    [139, 92, 246],   // 2 紫
    [120, 255, 214],  // 3 薄荷
    [235, 245, 255],  // 4 白
    [255, 64, 96],    // 5 暗红（悬疑）
    [255, 200, 120],  // 6 暖黄（温情）
    [255, 150, 195],  // 7 柔粉（温情）
    [255, 190, 60],   // 8 金橙（冒险）
    [70, 235, 150]    // 9 翠绿（冒险）
  ];
  /* 主题 → 粒子主色索引 + 运动特性 */
  const THEME_CI = {
    'sci-fi':    [0, 2, 3, 4],
    'mystery':   [5, 1, 2, 4],
    'warm':      [6, 7, 4, 3],
    'adventure': [8, 9, 0, 4]
  };
  let theme = 'sci-fi';

  // 预渲染发光精灵（避免使用 shadowBlur，性能更好）
  const SPRITES = PALETTE.map(c => {
    const s = 64, cv = document.createElement('canvas');
    cv.width = cv.height = s;
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0.00, rgba(c, 1));
    grd.addColorStop(0.18, rgba(c, 0.75));
    grd.addColorStop(0.45, rgba(c, 0.22));
    grd.addColorStop(1.00, rgba(c, 0));
    g.fillStyle = grd;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2); g.fill();
    return cv;
  });

  let W = 0, H = 0;
  const P = [];          // 常驻粒子
  const bits = [];       // 临时爆发 / 汇聚粒子
  const waves = [];      // 冲击波
  const mouse = { x: -9999, y: -9999, active: false };
  let hoverAt = null;    // {x,y} 卡片悬停吸附点
  let suck = null;       // {x,y,until} 强吸引（吸入）
  let warp = 0, warpTarget = 0;
  let t = 0, last = performance.now();

  /* ---------- 尺寸 ---------- */
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = Math.floor(W * DPR);
    cvs.height = Math.floor(H * DPR);
    cvs.style.width = W + 'px';
    cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  /* ---------- 创建粒子 ---------- */
  function makeP(x, y) {
    return {
      x: x ?? Math.random() * W,
      y: y ?? Math.random() * H,
      px: 0, py: 0,
      vx: (Math.random() - .5) * .6,
      vy: (Math.random() - .5) * .6,
      r: 0.7 + Math.random() * (MOBILE ? 1.6 : 2.3),
      a0: 0.35 + Math.random() * 0.55,
      a: 1,
      ci: Math.random() < .55 ? 0 : (Math.random() < .5 ? 1 : (Math.random() < .5 ? 2 : (Math.random() < .6 ? 3 : 4))),
      ph: Math.random() * Math.PI * 2,
      freq: 0.008 + Math.random() * 0.02
    };
  }
  function initParticles() {
    P.length = 0;
    for (let i = 0; i < MAX_P; i++) P.push(makeP());
  }

  /* ---------- 更新 ---------- */
  function update(dt) {
    t += dt;
    const cx = W / 2, cy = H / 2;
    const suckOn = suck && performance.now() < suck.until;

    for (const p of P) {
      p.px = p.x; p.py = p.y;
      p.ph += 0.012 * dt;

      // 1) 自由漂移（正弦扰动）
      p.vx += Math.cos(p.ph) * 0.020 * dt;
      p.vy += Math.sin(p.ph * 1.3) * 0.020 * dt;

      // 1.5) 文章主题影响粒子运动与闪烁
      if (warp < 0.05) {
        if (theme === 'warm') {                       // 温情：缓慢飘落
          p.vy += 0.011 * dt;
          p.vx += Math.sin(t * 0.02 + p.ph) * 0.014 * dt;
        } else if (theme === 'adventure') {           // 冒险：横向能量流
          p.vx += 0.018 * dt;
        } else if (theme === 'mystery') {             // 悬疑：随机故障闪烁
          if (Math.random() < 0.0035) p.a0 *= 0.25;
          if (Math.random() < 0.0035) p.a0 = Math.min(0.95, p.a0 * 1.6 + 0.05);
        }
      }

      // 2) 鼠标：吸引 + 绕行 + 轻微拖尾
      if (mouse.active && warp < 0.05) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const d2 = dx * dx + dy * dy, R = MOBILE ? 160 : 230;
        if (d2 < R * R && d2 > 4) {
          const d = Math.sqrt(d2), f = 1 - d / R;
          const nx = dx / d, ny = dy / d;
          p.vx += nx * f * 0.30 * dt;
          p.vy += ny * f * 0.30 * dt;
          p.vx += -ny * f * 0.55 * dt;   // 切向绕行
          p.vy += nx * f * 0.55 * dt;
        }
      }

      // 3) 卡片悬停：轻微吸附
      if (hoverAt && warp < 0.05) {
        const dx = hoverAt.x - p.x, dy = hoverAt.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        if (d < 260) {
          const f = (1 - d / 260) * 0.55;
          p.vx += dx / d * f * dt;
          p.vy += dy / d * f * dt;
        }
      }

      // 4) 点击吸入（进入卡片）：强吸引
      if (suckOn) {
        const dx = suck.x - p.x, dy = suck.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        const f = Math.min(3.2, 240 / d) * 1.15;
        p.vx += dx / d * f * dt;
        p.vy += dy / d * f * dt;
        p.vx *= 0.90; p.vy *= 0.90;
      }

      // 5) 冲击波：环形外推
      for (const w of waves) {
        const dx = p.x - w.x, dy = p.y - w.y;
        const d = Math.hypot(dx, dy) || 1;
        const diff = Math.abs(d - w.r);
        if (diff < w.thick) {
          const f = (1 - diff / w.thick) * (1 - w.r / w.max) * 3.4;
          p.vx += dx / d * f * dt;
          p.vy += dy / d * f * dt;
        }
      }

      // 6) 曲速：从中心向外加速拉伸
      if (warp > 0.02) {
        const dx = p.x - cx, dy = p.y - cy;
        const d = Math.hypot(dx, dy) || 1;
        const f = warp * (0.9 + d / Math.max(W, H) * 6);
        p.vx += dx / d * f * dt;
        p.vy += dy / d * f * dt;
      }

      // 阻尼 + 限速
      const damp = warp > 0.02 ? 0.985 : 0.945;
      p.vx *= damp; p.vy *= damp;
      const sp = Math.hypot(p.vx, p.vy), lim = warp > 0.02 ? 60 : 8;
      if (sp > lim) { p.vx = p.vx / sp * lim; p.vy = p.vy / sp * lim; }

      p.x += p.vx * dt; p.y += p.vy * dt;

      // 越界处理（曲速时从中心重生，形成隧道流）
      const m = 60;
      if (p.x < -m || p.x > W + m || p.y < -m || p.y > H + m) {
        if (warp > 0.4) {
          const ang = Math.random() * Math.PI * 2, rr = Math.random() * 40 + 6;
          p.x = cx + Math.cos(ang) * rr; p.y = cy + Math.sin(ang) * rr;
          p.px = p.x; p.py = p.y;
          p.vx = Math.cos(ang) * (2 + Math.random() * 4);
          p.vy = Math.sin(ang) * (2 + Math.random() * 4);
        } else {
          p.x = (p.x + W + m * 2) % (W + m * 2) - m;
          p.y = (p.y + H + m * 2) % (H + m * 2) - m;
          p.px = p.x; p.py = p.y;
        }
      }
      // 闪烁
      p.a = p.a0 * (0.72 + 0.28 * Math.sin(t * p.freq * 6));
    }

    // 冲击波推进
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.r += w.speed * dt;
      if (w.r > w.max) waves.splice(i, 1);
    }

    // 临时粒子
    for (let i = bits.length - 1; i >= 0; i--) {
      const b = bits[i];
      b.life -= dt;
      if (b.mode === 'in') {                    // 汇聚：向目标加速
        const dx = b.tx - b.x, dy = b.ty - b.y;
        const d = Math.hypot(dx, dy) || 1;
        b.vx += dx / d * 1.4 * dt;
        b.vy += dy / d * 1.4 * dt;
        if (d < 14) b.life = Math.min(b.life, 4);
      } else {
        b.vx *= 0.955; b.vy *= 0.955;
      }
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.life <= 0) bits.splice(i, 1);
    }
  }

  /* ---------- 绘制 ---------- */
  function draw() {
    // 淡出上一帧（保留透明，形成拖尾）
    ctx.globalCompositeOperation = 'destination-out';
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // 常驻粒子
    for (const p of P) {
      const c = PALETTE[p.ci], sp = SPRITES[p.ci], size = p.r * 8;
      if (warp > 0.05) {
        // 曲速：拉成星线
        const dx = p.x - p.px, dy = p.y - p.py;
        ctx.globalAlpha = Math.min(1, p.a * (0.5 + warp * 0.6));
        ctx.strokeStyle = rgba(c, 0.55);
        ctx.lineWidth = Math.max(0.8, p.r * 0.85);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x - dx * (1 + warp * 7), p.y - dy * (1 + warp * 7));
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      } else {
        // 拖尾
        ctx.globalAlpha = p.a * 0.28;
        ctx.strokeStyle = rgba(c, 0.5);
        ctx.lineWidth = Math.max(0.6, p.r * 0.7);
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      }
      ctx.globalAlpha = Math.min(1, p.a * (warp > 0.05 ? 0.85 : 1));
      ctx.drawImage(sp, p.x - size / 2, p.y - size / 2, size, size);
    }

    // 临时粒子
    for (const b of bits) {
      const alpha = Math.max(0, b.life / b.ttl);
      const c = PALETTE[b.ci], sp = SPRITES[b.ci], size = b.r * 8;
      ctx.globalAlpha = alpha * 0.5;
      ctx.strokeStyle = rgba(c, 0.6);
      ctx.lineWidth = Math.max(0.8, b.r * 0.8);
      ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.globalAlpha = alpha;
      ctx.drawImage(sp, b.x - size / 2, b.y - size / 2, size, size);
    }

    // 冲击波环
    for (const w of waves) {
      const k = 1 - w.r / w.max;
      ctx.globalAlpha = k * 0.9;
      ctx.strokeStyle = rgba(PALETTE[w.ci], 0.75 * k);
      ctx.lineWidth = 2.2 * k + 0.4;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = k * 0.35;
      ctx.strokeStyle = rgba(PALETTE[w.ci], 0.35 * k);
      ctx.lineWidth = 10 * k;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.94, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 主循环 ---------- */
  function frame(now) {
    const dt = Math.min(3, (now - last) / 16.667) || 1;
    last = now;
    warp += (warpTarget - warp) * 0.05 * dt;
    if (suck && now > suck.until) suck = null;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- 对外 API ---------- */
  const API = {
    init() {
      resize(); initParticles();
      window.addEventListener('resize', () => { resize(); }, { passive: true });
      // 鼠标 / 触摸
      window.addEventListener('mousemove', e => {
        mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
      }, { passive: true });
      window.addEventListener('mouseleave', () => { mouse.active = false; });
      window.addEventListener('touchmove', e => {
        const tp = e.touches[0];
        if (tp) { mouse.x = tp.clientX; mouse.y = tp.clientY; mouse.active = true; }
      }, { passive: true });
      // 点击冲击波
      window.addEventListener('pointerdown', e => {
        mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
        API.shock(e.clientX, e.clientY);
      }, { passive: true });
      requestAnimationFrame(frame);
    },
    /** 冲击波：粒子向外散开后缓慢恢复 */
    shock(x, y) {
      waves.push({ x, y, r: 6, max: Math.max(W, H) * 0.62, speed: 13, thick: 78, ci: Math.random() < .5 ? 0 : 1 });
      API.burst(x, y, MOBILE ? 10 : 20);
    },
    /** 爆发粒子 */
    burst(x, y, n = 40, ci = null) {
      n = Math.min(n, MOBILE ? 26 : 90);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * (ci === null ? 9 : 6);
        bits.push({
          x, y, px: x, py: y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          r: 0.8 + Math.random() * 2.2,
          ci: ci ?? (Math.random() < .5 ? 0 : (Math.random() < .5 ? 1 : (Math.random() < .6 ? 2 : 4))),
          life: 40 + Math.random() * 60, ttl: 100, mode: 'out', tx: x, ty: y
        });
      }
    },
    /** 汇聚粒子（吸入卡片） */
    converge(x, y, n = 46) {
      n = Math.min(n, MOBILE ? 22 : 80);
      const R = Math.min(W, H) * 0.55;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, rr = R * (0.45 + Math.random() * 0.55);
        const bx = x + Math.cos(a) * rr, by = y + Math.sin(a) * rr;
        bits.push({
          x: bx, y: by, px: bx, py: by,
          vx: -Math.cos(a) * 3, vy: -Math.sin(a) * 3,
          r: 0.7 + Math.random() * 1.8, ci: Math.random() < .5 ? 0 : (Math.random() < .4 ? 1 : 2),
          life: 40 + Math.random() * 34, ttl: 74, mode: 'in', tx: x, ty: y
        });
      }
    },
    /** 强吸引点（吸入效果），持续 ms */
    suckAt(x, y, ms = 620) { suck = { x, y, until: performance.now() + ms }; },
    /** 卡片悬停吸附点 */
    setHover(x, y) { hoverAt = (x == null) ? null : { x, y }; },
    /** 曲速隧道 0~1 */
    setWarp(v) { warpTarget = v; },
    getWarp() { return warp; },
    /**
     * 切换文章主题：重染粒子颜色并改变运动特性
     * @param {"sci-fi"|"mystery"|"warm"|"adventure"} name
     */
    setTheme(name) {
      theme = THEME_CI[name] ? name : 'sci-fi';
      const ci = THEME_CI[theme];
      for (const p of P) {
        if (Math.random() < 0.72) p.ci = ci[(Math.random() * ci.length) | 0];
        // 恢复被故障效果改过的亮度
        p.a0 = 0.35 + Math.random() * 0.55;
      }
    },
    get mobile() { return MOBILE; }
  };
  return API;
})();

/* =========================================================================
 * 二、DOM 特效小工具（白光 / 光环 / 曲速环 / 碎裂）
 * ========================================================================= */
const fxRoot = $('#fx-root');
const flashEl = $('#flash');

function flash(color = '255,255,255', dur = 760) {
  flashEl.style.background =
    `radial-gradient(circle at 50% 50%, rgba(${color},.95), rgba(${color},.28) 36%, rgba(${color},0) 70%)`;
  flashEl.animate(
    [{ opacity: 0 }, { opacity: 1, offset: .16 }, { opacity: 0 }],
    { duration: dur, easing: 'ease-out' }
  );
}

/** 在指定坐标产生径向光环 */
function pulseRing(x, y, color = '34,224,255', dur = 900, scale = 1) {
  const d = document.createElement('div');
  d.className = 'pulse-ring';
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  d.style.setProperty('--rc', color);
  d.style.width = d.style.height = (60 * scale) + 'vmax';
  d.style.margin = (-30 * scale) + 'vmax 0 0 ' + (-30 * scale) + 'vmax';
  fxRoot.appendChild(d);
  const an = d.animate(
    [
      { transform: 'scale(.12)', opacity: 0 },
      { transform: 'scale(.5)', opacity: .95, offset: .25 },
      { transform: 'scale(1.35)', opacity: 0 }
    ],
    { duration: dur, easing: 'cubic-bezier(.16,.8,.24,1)' }
  );
  an.finished.then(() => d.remove()).catch(() => d.remove());
}

/** 曲速隧道：多重同心环 */
function warpTunnel() {
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('div');
    d.className = 'warp-ring';
    d.style.borderColor = i % 2 ? 'rgba(255,47,208,.5)' : 'rgba(34,224,255,.55)';
    fxRoot.appendChild(d);
    const an = d.animate(
      [
        { transform: 'scale(.15)', opacity: 0 },
        { transform: 'scale(1.2)', opacity: .95, offset: .22 },
        { transform: 'scale(9)', opacity: 0 }
      ],
      { duration: 1000, delay: i * 80, easing: 'cubic-bezier(.3,.7,.2,1)' }
    );
    an.finished.then(() => d.remove()).catch(() => d.remove());
  }
}

/**
 * 玻璃碎裂：把登录卡片切成 cols×rows 碎片并向外炸开
 */
function shatter(el, cols = 7, rows = 5) {
  const rect = el.getBoundingClientRect();
  const bg = getComputedStyle(el).backgroundImage || 'linear-gradient(160deg, rgba(18,30,64,.9), rgba(46,14,72,.7))';
  const cw = rect.width, ch = rect.height;
  const fw = cw / cols, fh = ch / rows;
  const cx = rect.left + cw / 2, cy = rect.top + ch / 2;
  const frags = [];

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const f = document.createElement('div');
      f.className = 'shard';
      const ox = c * fw, oy = r * fh;
      Object.assign(f.style, {
        left: (rect.left + ox) + 'px',
        top: (rect.top + oy) + 'px',
        width: fw + 'px',
        height: fh + 'px',
        backgroundImage: bg,
        backgroundSize: cw + 'px ' + ch + 'px',
        backgroundPosition: (-ox) + 'px ' + (-oy) + 'px'
      });
      fxRoot.appendChild(f);
      frags.push({ el: f, ox, oy });
    }
  }

  // 原卡片立刻隐藏
  el.style.transition = 'none';
  el.style.opacity = '0';

  frags.forEach(({ el: f, ox, oy }) => {
    const fx = rect.left + ox + fw / 2, fy = rect.top + oy + fh / 2;
    const dx = fx - cx, dy = fy - cy;
    const d = Math.hypot(dx, dy) || 1;
    const dist = 90 + Math.random() * 260;
    const an = f.animate(
      [
        { transform: 'translate(0,0) rotate(0deg) scale(1)', opacity: 1, filter: 'brightness(1)' },
        {
          transform: `translate(${dx / d * dist * .5}px, ${dy / d * dist * .5}px) rotate(${(Math.random() - .5) * 90}deg) scale(1.25)`,
          opacity: .95, filter: 'brightness(2.2)', offset: .22
        },
        {
          transform: `translate(${dx / d * dist}px, ${dy / d * dist + 60}px) rotate(${(Math.random() - .5) * 220}deg) scale(.25)`,
          opacity: 0, filter: 'brightness(.6)'
        }
      ],
      { duration: 780 + Math.random() * 420, delay: Math.random() * 90, easing: 'cubic-bezier(.2,.75,.3,1)', fill: 'forwards' }
    );
    an.finished.then(() => f.remove()).catch(() => f.remove());
  });
  return { cx, cy };
}

/* =========================================================================
 * 三、视图路由
 * ========================================================================= */
const views = {
  login: $('#view-login'),
  home: $('#view-home'),
  inner: $('#view-inner'),
  article: $('#view-article')
};
let currentView = 'login';

function showView(name) {
  Object.entries(views).forEach(([k, v]) => {
    v.classList.toggle('on', k === name);
    v.style.opacity = ''; v.style.transform = ''; v.style.filter = '';
  });
  clearAnims(views[name]);
  currentView = name;
}
/** 清除元素上残留的 WAAPI 动画（避免 fill:forwards 状态堆积） */
function clearAnims(el) {
  if (el && el.getAnimations) el.getAnimations().forEach(a => { try { a.cancel(); } catch (e) {} });
}
/** 出场：隐藏并清理内联样式 */
function hideView(el) {
  el.classList.remove('on');
  el.style.opacity = ''; el.style.transform = ''; el.style.filter = ''; el.style.pointerEvents = '';
  clearAnims(el);
}

/* =========================================================================
 * 四、登录页逻辑
 * ========================================================================= */
const loginCard = $('#login-card');
const userInput = $('#username');
const passInput = $('#password');
const loginBtn = $('#login-btn');
const loginBtnText = $('#login-btn-text');
const loginMsg = $('#login-msg');
const fUser = $('#f-user'), fPass = $('#f-pass');

/* 凭证不明文存储在页面上：源码中只保留编码值，校验时解码比对。
   注意：这是纯前端固定校验，仅用于演示，不具备任何真实安全性。 */
const _ENC_USER = 'enh5';   // base64 → zxy
const _ENC_PASS = 'MDAx';   // base64 → 001
const dec = s => { try { return atob(s); } catch (e) { return ''; } };
const VALID_USER = dec(_ENC_USER);
const VALID_PASS = dec(_ENC_PASS);
let logging = false;

loginCard.addEventListener('submit', e => { e.preventDefault(); doLogin(); });
loginBtn.addEventListener('click', e => { e.preventDefault(); doLogin(); });

function showError(msg) {
  loginMsg.textContent = msg;
  loginMsg.classList.add('show');
  loginCard.classList.remove('shake');
  void loginCard.offsetWidth;
  loginCard.classList.add('shake');
  fUser.classList.add('err'); fPass.classList.add('err');
  setTimeout(() => {
    loginMsg.classList.remove('show');
    fUser.classList.remove('err'); fPass.classList.remove('err');
  }, 2600);
}

async function doLogin() {
  if (logging) return;
  const u = userInput.value.trim().toLowerCase();
  const p = passInput.value.trim();

  if (u !== VALID_USER || p !== VALID_PASS) {
    showError('账号或密码错误');
    return;
  }

  logging = true;
  loginBtn.classList.add('busy');
  loginBtnText.textContent = '身 份 验 证 中';
  loginMsg.classList.remove('show');

  // 按钮充能光
  pulseRing(innerWidth / 2, innerHeight / 2, '34,224,255', 700, .5);
  await sleep(560);
  loginBtnText.textContent = '验 证 通 过';
  FX.burst(innerWidth / 2, innerHeight / 2, 40);

  await loginSuccess();
}

async function loginSuccess() {
  const { cx, cy } = shatter(loginCard, FX.mobile ? 5 : 7, FX.mobile ? 4 : 5);

  await sleep(140);
  flash('255,255,255', 900);                 // 白光扩散
  pulseRing(cx, cy, '34,224,255', 1000, .9);
  FX.burst(cx, cy, FX.mobile ? 50 : 110, 4); // 粒子爆发
  FX.burst(cx, cy, 40, 0);

  // 登录页整体粒子化消散
  views.login.animate(
    [
      { opacity: 1, filter: 'blur(0px)', transform: 'scale(1)' },
      { opacity: 0, filter: 'blur(14px)', transform: 'scale(1.18)' }
    ],
    { duration: 620, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }
  );

  await sleep(520);
  hideView(views.login);
  // 恢复登录卡片（便于调试 / 再次进入）
  loginCard.style.transition = '';
  loginCard.style.opacity = '';
  loginBtn.classList.remove('busy');
  loginBtnText.textContent = '进 入 系 统';
  logging = false;

  enterHome();
}

/* ---- 开始游戏：星际穿越 ---- */
const startBtn = $('#start-btn');
let warping = false;
startBtn.addEventListener('click', async () => {
  if (warping) return;
  warping = true;

/* ---- 内页卡片：只由 stories 生成（没有文章就不会出现空方块） ---- */
const lifeCards = stories.map(s => {
  const th = THEMES[s.theme] || THEMES['sci-fi'];
  return {
    id: s.id,
    title: s.title,
    subtitle: s.subtitle,
    icon: s.icon,
    color: th.color,
    theme: s.theme
  };
});

const grid = $('#grid');
$('#card-count').textContent = lifeCards.length;

lifeCards.forEach(c => {
  const el = document.createElement('article');
  el.className = 'life-card';
  el.style.setProperty('--c', c.color);
  el.dataset.id = c.id;
  el.innerHTML = `
    <div class="card-ico">${c.icon}</div>
    <div class="card-txt">
      <h3 class="card-title">${c.title}</h3>
      <p class="card-sub">${c.subtitle}</p>
    </div>
    <span class="card-no">NO.${String(c.id).padStart(2, '0')}</span>
  `;

  /* --- 3D 倾斜（仅非触屏） --- */
  if (!FX.mobile) {
    el.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width - .5;
      const py = (e.clientY - r.top) / r.height - .5;
      el.style.transform =
        `perspective(800px) rotateY(${px * 14}deg) rotateX(${-py * 12}deg) translateZ(14px) scale(1.045)`;
    });
    el.addEventListener('mouseenter', () => {
      const r = el.getBoundingClientRect();
      FX.setHover(r.left + r.width / 2, r.top + r.height / 2);  // 粒子吸附
    });
    el.addEventListener('mouseleave', () => {
      el.style.transform = '';
      FX.setHover(null);
    });
  }

  el.addEventListener('click', () => openArticle(c.id, el));
  grid.appendChild(el);
});

    { duration: 820, easing: 'cubic-bezier(.16,1,.3,1)' }
  );
  const cards = [...grid.children];
  cards.forEach((el, i) => {
    el.animate(
      [
        { opacity: 0, transform: 'translateY(46px) rotateX(-38deg) scale(.86)' },
        { opacity: 1, transform: 'translateY(0) rotateX(0) scale(1)' }
      ],
      { duration: 620, delay: 60 + i * 45, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }
    );
  });
}

/* =========================================================================
 * 七、文章页：渲染 / 进入 / 返回 / 主题切换
 * ========================================================================= */
const articlePanel = $('#article-panel');
const aTag = $('#a-tag'), aTitle = $('#a-title'), aMeta = $('#a-meta');
const aCast = $('#a-cast'), aHook = $('#a-hook'), aBody = $('#a-body');
const readingBar = $('#reading-progress');
const articleNext = $('#article-next');
const themeFx = $('#theme-fx');

let currentId = null;
let animating = false;

/** 简单 HTML 转义，避免正文里的尖括号破坏结构 */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/**
 * 切换全局主题：body class + CSS 变量 + 粒子配色 + 主题背景层
 * @param {"sci-fi"|"mystery"|"warm"|"adventure"} name
 */
function applyTheme(name) {
  const key = THEMES[name] ? name : 'sci-fi';
  document.body.className = 'theme-' + key;
  FX.setTheme(key);
}

/** 阅读进度条 */
function updateProgress() {
  const el = views.article;
  const max = el.scrollHeight - el.clientHeight;
  readingBar.style.width = (max > 0 ? (el.scrollTop / max) * 100 : 0).toFixed(2) + '%';
}
views.article.addEventListener('scroll', updateProgress, { passive: true });
window.addEventListener('resize', updateProgress, { passive: true });

/**
 * 按 story 对象渲染整篇内容（标题 / 角色 / 钩子 / 正文）
 */
function renderArticle(s) {
  const th = THEMES[s.theme] || THEMES['sci-fi'];
  const wordCount = s.content.replace(/\s/g, '').length;

  // 1) 头部
  aTag.textContent = `${th.label} · ${th.name}`;
  aTitle.textContent = s.title;
  aMeta.innerHTML =
    `模拟人生 · 第 <b>${String(s.id).padStart(2, '0')}</b> 段 ／ 主角 <b>${esc(s.protagonist.name)}</b> ／ 全文约 <b>${wordCount}</b> 字`;

  // 2) 角色介绍：主角 + 配角
  const castList = [
    { role: '主角', lead: true, ...s.protagonist },
    ...(s.supporting || []).map(x => ({ role: '配角', lead: false, ...x }))
  ];
  aCast.innerHTML = castList.map(c => `
    <div class="cast-card${c.lead ? ' lead' : ''}">
      <div class="avatar">${esc(c.name.slice(0, 1))}</div>
      <div class="cast-info">
        <span class="cast-role">${c.role}</span>
        <h3 class="cast-name">${esc(c.name)}</h3>
        <p class="cast-desc">${esc(c.personality)}</p>
      </div>
    </div>
  `).join('');

  // 3) 开头钩子
  aHook.textContent = s.hook;

  // 4) 正文：按空行分段；"第X章" 渲染为章节小标题；纯对话段落高亮
  aBody.innerHTML = s.content.trim().split(/\n+/).map(t => {
    const p = t.trim();
    if (!p) return '';
    if (/^第[一二三四五六七八九十百]+章/.test(p)) {
      return `<h2 class="chapter">${esc(p)}</h2>`;
    }
    const isDialog = /^[“"『]/.test(p);
    return `<p class="${isDialog ? 'dialogue' : ''}">${esc(p)}</p>`;
  }).join('');

  // 5) 多篇文章时才显示“下一段人生”
  articleNext.hidden = stories.length < 2;

  views.article.scrollTop = 0;
  updateProgress();
}

/**
 * 进入文章页：粒子吸入 + 径向光 + 模糊穿越
 */
async function openArticle(id, cardEl) {
  if (animating) return;
  animating = true;
  const s = stories.find(x => x.id === id);
  if (!s) { animating = false; return; }
  currentId = id;

  const th = THEMES[s.theme] || THEMES['sci-fi'];
  // 主题先切换，让背景与粒子在穿越过程中渐变到本篇风格
  applyTheme(s.theme);
  themeFx.classList.add('show');

  const r = cardEl.getBoundingClientRect();
  const cxp = r.left + r.width / 2, cyp = r.top + r.height / 2;

  // 1) 粒子吸入 + 径向光
  FX.suckAt(cxp, cyp, 760);
  FX.converge(cxp, cyp, FX.mobile ? 26 : 76);
  pulseRing(cxp, cyp, th.color, 950, .85);

  // 2) 卡片放大穿越
  cardEl.style.zIndex = 9;
  cardEl.animate(
    [
      { transform: 'scale(1)', opacity: 1, filter: 'brightness(1) blur(0px)' },
      { transform: 'scale(1.18)', opacity: 1, filter: 'brightness(1.8) blur(1px)', offset: .3 },
      { transform: 'scale(2.4)', opacity: 0, filter: 'brightness(3) blur(16px)' }
    ],
    { duration: 660, easing: 'cubic-bezier(.5,0,.9,.4)', fill: 'forwards' }
  );

  // 3) 内页模糊退场
  await sleep(300);
  views.inner.animate(
    [
      { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
      { opacity: 0, transform: 'scale(.9)', filter: 'blur(18px)' }
    ],
    { duration: 560, easing: 'cubic-bezier(.4,0,.7,.4)', fill: 'forwards' }
  );

  await sleep(300);
  flash(th.color, 720);
  hideView(views.inner);
  cardEl.style.zIndex = ''; cardEl.style.transform = ''; cardEl.style.opacity = '';
  FX.setHover(null);

  // 4) 渲染内容
  clearAnims(articlePanel);
  articlePanel.style.opacity = ''; articlePanel.style.transform = ''; articlePanel.style.filter = '';
  renderArticle(s);

  // 5) 文章页径向展开进入
  showView('article');
  articlePanel.animate(
    [
      { opacity: 0, transform: 'scale(.7) rotateX(26deg)', filter: 'blur(28px)' },
      { opacity: 1, transform: 'scale(1) rotateX(0deg)', filter: 'blur(0px)' }
    ],
    { duration: 780, easing: 'cubic-bezier(.16,1,.3,1)' }
  );
  // 内部区块错落浮现
  [$('.article-hero'), aCast, aHook, aBody].forEach((el, i) => {
    if (!el) return;
    el.animate(
      [
        { opacity: 0, transform: 'translateY(30px)' },
        { opacity: 1, transform: 'translateY(0)' }
      ],
      { duration: 560, delay: 200 + i * 110, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }
    );
  });

  await sleep(520);
  animating = false;
}

/**
 * 返回内页：反向穿越（缩小 + 模糊 + 粒子外爆 + 淡入）
 */
async function backToInner() {
  if (animating) return;
  animating = true;

  // 1) 文章页反向穿越
  articlePanel.animate(
    [
      { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' },
      { opacity: 0, transform: 'scale(.62) rotateX(-18deg)', filter: 'blur(24px)' }
    ],
    { duration: 560, easing: 'cubic-bezier(.5,0,.85,.4)', fill: 'forwards' }
  );
  views.article.animate(
    [{ opacity: 1 }, { opacity: 0 }],
    { duration: 560, easing: 'ease-in', fill: 'forwards' }
  );

  await sleep(200);
  // 2) 反向粒子：从中心向外爆开
  FX.burst(innerWidth / 2, innerHeight / 2, FX.mobile ? 30 : 70);
  pulseRing(innerWidth / 2, innerHeight / 2, '139,92,246', 800, .8);

  await sleep(360);
  hideView(views.article);
  // 恢复默认（科幻）主题
  applyTheme('sci-fi');
  themeFx.classList.remove('show');

  // 3) 内页淡入
  showView('inner');
  views.inner.animate(
    [
      { opacity: 0, transform: 'scale(1.06)', filter: 'blur(16px)' },
      { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }
    ],
    { duration: 700, easing: 'cubic-bezier(.16,1,.3,1)' }
  );
  [...grid.children].forEach((el, i) => {
    el.animate(
      [
        { opacity: 0, transform: 'translateY(18px) scale(.96)' },
        { opacity: 1, transform: 'none' }
      ],
      { duration: 480, delay: i * 22, easing: 'ease-out', fill: 'backwards' }
    );
  });

  await sleep(520);
  animating = false;
}

/* ---- 按钮绑定 ---- */
$('#article-back').addEventListener('click', backToInner);
$('#article-back2').addEventListener('click', backToInner);
// ESC 也可返回
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && currentView === 'article') backToInner();
});

/* ---- 切换下一段人生（原地翻转换肤，展示主题差异） ---- */
articleNext.addEventListener('click', () => {
  if (animating || stories.length < 2) return;
  const idx = stories.findIndex(x => x.id === currentId);
  const next = stories[(idx + 1) % stories.length];
  articlePanel.animate(
    [
      { opacity: 1, transform: 'rotateY(0deg) scale(1)', filter: 'blur(0px)' },
      { opacity: 0, transform: 'rotateY(62deg) scale(.92)', filter: 'blur(10px)', offset: .5 },
      { opacity: 1, transform: 'rotateY(0deg) scale(1)', filter: 'blur(0px)' }
    ],
    { duration: 620, easing: 'cubic-bezier(.4,0,.3,1)' }
  );
  setTimeout(() => {
    currentId = next.id;
    applyTheme(next.theme);
    renderArticle(next);
    flash((THEMES[next.theme] || THEMES['sci-fi']).color, 620);
  }, 300);
});

/* =========================================================================
 * 八、启动
 * ========================================================================= */
FX.init();
applyTheme('sci-fi');   // 初始（登录/主页/内页）使用科幻主题
// 键盘回车已在 form submit 中生效；补充输入框回车
[userInput, passInput].forEach(inp => {
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLogin(); } });
});
// 首屏：粒子轻微汇聚到登录卡片
setTimeout(() => {
  const r = loginCard.getBoundingClientRect();
  FX.converge(r.left + r.width / 2, r.top + r.height / 2, FX.mobile ? 12 : 34);
}, 400);
</script>
