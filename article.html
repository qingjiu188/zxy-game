<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<title>文章 · 郑晓银的模拟人生</title>

<!-- 全局样式 + 文章页样式 -->
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/article.css" />
</head>
<body class="theme-sci-fi">

<!-- ===== 全局背景层（每页共用） ===== -->
<div class="nebula"></div>
<div id="theme-fx"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<!-- ===== 特效层（每页共用） ===== -->
<div class="fx-layer" id="fx-root"></div>
<div class="fx-layer" id="flash"></div>

<!-- ===== 视图：文章页 ===== -->
<section class="view on" id="view-article">
  <div class="reading-bar"><i id="reading-progress"></i></div>
  <button class="article-back" id="article-back" type="button">← 返回</button>

  <div class="article-wrap">
    <article class="article-panel" id="article-panel">
      <!-- 头部：主题标签 / 文档名 / 元信息 -->
      <header class="article-hero">
        <span class="article-tag" id="a-tag">STORY</span>
        <h1 class="article-title" id="a-title">文档名</h1>
        <p class="article-meta" id="a-meta"></p>
      </header>

      <!-- 角色介绍区：主角 + 配角 -->
      <section class="cast" id="a-cast"></section>

      <!-- 开头钩子 -->
      <blockquote class="hook" id="a-hook"></blockquote>

      <!-- 正文 -->
      <div class="article-body" id="a-body"></div>

      <!-- 底部操作 -->
      <footer class="article-foot">
        <span class="foot-tip">— 本段人生 · 已读取完毕 —</span>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="ghost-btn" id="article-back2" type="button">← 返回列表</button>
          <button class="ghost-btn" id="article-next" type="button" hidden>下一段人生 →</button>
        </div>
      </footer>
    </article>
  </div>
</section>

<!-- ===== 脚本：公共 → 页面 ===== -->
<script src="js/fx.js"></script>
<script src="js/data.js"></script>
<script src="js/transition.js"></script>
<script src="js/article.js"></script>
</body>
</html>
